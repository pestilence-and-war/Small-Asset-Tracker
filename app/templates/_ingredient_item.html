<li id="ingredient-{{ ingredient.id }}" class="ingredient-item">
    <div class="ingredient-display">
        {% if ingredient.image_url %}
            <div class="ingredient-image">
                <img src="{{ ingredient.image_url }}" alt="{{ ingredient.name }}" loading="lazy">
            </div>
        {% else %}
            <div class="ingredient-image-placeholder">
                <i data-lucide="package"></i>
            </div>
        {% endif %}

        <div class="ingredient-info">
            <div class="ingredient-name-row" style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
                <span class="ingredient-name">{{ ingredient.name|title }}</span>
                {% if ingredient.quantity > 0 %}
                    <span class="stock-badge in-stock">In Stock</span>
                {% else %}
                    <span class="stock-badge out-stock">Out of Stock</span>
                {% endif %}
            </div>
            
            <div class="ingredient-controls-row" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
                <form hx-post="/update_ingredient/{{ ingredient.id }}" hx-target="#ingredient-{{ ingredient.id }}" hx-swap="outerHTML" style="display: inline-flex; align-items: center; gap: 0.25rem; margin: 0; padding: 0; background: transparent; border: none; box-shadow: none;">
                    <input type="hidden" name="name" value="{{ ingredient.name }}">
                    <input type="hidden" name="quantity" value="{{ [ingredient.quantity - 1, 0]|max }}">
                    <button type="submit" class="quick-qty-btn" title="Decrease Quantity">-</button>
                </form>

                <span class="ingredient-qty">{{ '%.2f'|format(ingredient.display_quantity) }}</span>

                <form hx-post="/update_ingredient/{{ ingredient.id }}" hx-target="#ingredient-{{ ingredient.id }}" hx-swap="outerHTML" style="display: inline-flex; align-items: center; gap: 0.25rem; margin: 0; padding: 0; background: transparent; border: none; box-shadow: none;">
                    <input type="hidden" name="name" value="{{ ingredient.name }}">
                    <input type="hidden" name="quantity" value="{{ ingredient.quantity + 1 }}">
                    <button type="submit" class="quick-qty-btn" title="Increase Quantity">+</button>
                </form>

                <form class="unit-selector-form" style="margin: 0; padding: 0; background: transparent; border: none; box-shadow: none;">
                    <input type="hidden" name="view_name" value="{{ view_name or 'pantry' }}">
                    <select name="unit"
                            hx-post="/update_ingredient_display_unit/{{ ingredient.id }}"
                            hx-trigger="change"
                            hx-target="#ingredient-{{ ingredient.id }}"
                            hx-swap="outerHTML"
                            hx-include="[name='view_name']"
                            style="margin: 0; padding: 0.25rem 0.4rem; font-size: 0.8rem; width: auto;">
                        {% for unit in ingredient.compatible_units %}
                        <option value="{{ unit }}" {% if unit == ingredient.display_unit %}selected{% endif %}>
                            {{ unit }}
                        </option>
                        {% endfor %}
                    </select>
                </form>

                {% if show_edit_buttons %}
                    <button hx-get="/edit_ingredient_form/{{ ingredient.id }}?view_name={{ view_name or 'pantry' }}" 
                            hx-target="#ingredient-{{ ingredient.id }}" 
                            hx-swap="innerHTML" 
                            class="button-secondary"
                            style="padding: 0.25rem 0.5rem; font-size: 0.775rem;">
                        <i data-lucide="edit-2" style="width: 12px; height: 12px;"></i> Edit
                    </button>
                {% endif %}
            </div>
        </div>
    </div>
</li>
