<div class="pantry-header" style="margin-bottom: 2rem;">
    <h1 style="display: flex; align-items: center; gap: 0.75rem;"><i data-lucide="scan-barcode" style="color: var(--primary);"></i> Barcode Scanner</h1>
    <p style="color: var(--text-muted);">Scan a product barcode to quickly add it to your pantry.</p>
</div>

<div class="container card" style="text-align: center; padding: 2rem;">
    <div id="scanner-controls" style="margin-bottom: 2rem;">
        <button id="start-scan-btn" class="button-primary" style="padding: 1rem 2rem; font-size: 1.1rem;">
            <i data-lucide="camera"></i> Start Camera
        </button>
    </div>
    
    <div id="reader-container" style="display: none; position: relative; max-width: 500px; margin: 0 auto; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--border);">
        <div id="reader"></div>
        <button id="stop-scan-btn" class="button-danger" style="position: absolute; top: 1rem; right: 1rem; z-index: 10; padding: 0.5rem;">
            <i data-lucide="x"></i>
        </button>
    </div>
    
    <div id="result" style="margin-top: 2rem;"></div>
</div>

<style>
    #reader video {
        border-radius: var(--radius-sm);
    }
    .success-message {
        color: #065f46;
        background: #ecfdf5;
        padding: 1.5rem;
        border-radius: var(--radius);
        border: 1px solid #10b981;
        margin-top: 1rem;
        font-weight: 500;
    }
    .error-message {
        color: #991b1b;
        background: #fef2f2;
        padding: 1.5rem;
        border-radius: var(--radius);
        border: 1px solid #ef4444;
        margin-top: 1rem;
    }
</style>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    (function() {
        // Initialize Lucide icons for the new content
        if (window.lucide) {
            lucide.createIcons();
        }

        const startScanBtn = document.getElementById('start-scan-btn');
        const stopScanBtn = document.getElementById('stop-scan-btn');
        const readerContainer = document.getElementById('reader-container');
        const resultDiv = document.getElementById('result');
        let html5QrCode;

        startScanBtn.addEventListener('click', () => {
            readerContainer.style.display = 'block';
            startScanBtn.parentElement.style.display = 'none';
            resultDiv.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-muted);"><i data-lucide="loader" class="animate-spin"></i> Requesting camera access...</div>';
            if (window.lucide) lucide.createIcons();

            html5QrCode = new Html5Qrcode("reader");
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
            };

            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                stopScanner();
                resultDiv.innerHTML = `<div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--primary);"><i data-lucide="loader" class="animate-spin"></i> Processing UPC: <strong>${decodedText}</strong>...</div>`;
                if (window.lucide) lucide.createIcons();

                fetch('/api/add_item_by_upc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ upc: decodedText }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        resultDiv.innerHTML = `
                            <div class="success-message">
                                <i data-lucide="check-circle" style="margin-bottom: 0.5rem;"></i>
                                <div>${data.message}</div>
                            </div>
                            <button id="scan-again-btn" class="button-secondary" style="margin-top: 1.5rem;">
                                <i data-lucide="refresh-cw"></i> Scan Another Item
                            </button>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="error-message">
                                <i data-lucide="alert-circle" style="margin-bottom: 0.5rem;"></i>
                                <div>${data.message}</div>
                            </div>
                            <button id="scan-again-btn" class="button-secondary" style="margin-top: 1.5rem;">
                                <i data-lucide="refresh-cw"></i> Try Again
                            </button>
                        `;
                    }
                    if (window.lucide) lucide.createIcons();
                    
                    document.getElementById('scan-again-btn').addEventListener('click', () => {
                        resultDiv.innerHTML = '';
                        startScanBtn.parentElement.style.display = 'block';
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultDiv.innerHTML = '<div class="error-message">Connection error. Please try again.</div>';
                });
            };

            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
                .catch((err) => {
                    console.error("Unable to start scanning.", err);
                    resultDiv.innerHTML = '<div class="error-message">Error: Could not start scanner. Please ensure camera permissions are granted.</div>';
                    readerContainer.style.display = 'none';
                    startScanBtn.parentElement.style.display = 'block';
                });
        });

        stopScanBtn.addEventListener('click', stopScanner);

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    readerContainer.style.display = 'none';
                    startScanBtn.parentElement.style.display = 'block';
                }).catch(err => console.error("Failed to stop scanner", err));
            } else {
                readerContainer.style.display = 'none';
                startScanBtn.parentElement.style.display = 'block';
            }
        }
    })();
</script>
