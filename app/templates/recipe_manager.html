<h1>Recipe Manager</h1>

<!-- Add New Meal Form -->
<div id="add-meal-container">
    <h2>Add New Meal</h2>
    <form hx-post="/add_meal" hx-target="#meals-list-container" hx-swap="innerHTML">
        <input type="text" name="meal_name" placeholder="New meal name..." required>
        <button type="submit" class="button-primary">Add Meal</button>
    </form>
</div>

<hr>

<!-- Import Recipe Form -->
<div id="import-recipe-container">
    <h2>Import Recipe from Text</h2>
    <form hx-post="/import_recipe_process" hx-target="#content" hx-swap="innerHTML" hx-indicator="#import-indicator">
        <textarea name="recipe_text" rows="10" placeholder="Paste your recipe here..." required></textarea>
        <button type="submit" class="button-primary">Import Recipe</button>
        <span id="import-indicator" class="htmx-indicator">
            <i>Importing... This may take a moment.</i>
        </span>
    </form>
</div>

<hr>

<!-- Filter Meals Form -->
<h2>Filter Meals by Ingredients</h2>
<form id="filter-form" hx-post="/filter_meals" hx-target="#meals-list-container" hx-swap="innerHTML">
    <div class="filter-grid">
        {% for category, ingredients_in_category in ingredients_by_category.items() %}
            <div class="filter-category-group">
                <label for="filter-{{ category }}">{{ category }}</label>
                <select name="ingredient_ids" id="filter-{{ category }}" multiple>
                    {% for ingredient in ingredients_in_category %}
                        <option value="{{ ingredient.id }}">{{ ingredient.name }}</option>
                    {% endfor %}
                </select>
            </div>
        {% endfor %}
    </div>
    <div class="form-buttons">
        <button type="submit" class="button-primary">Filter Meals</button>
        <button type="button"
                hx-post="/filter_meals"
                hx-target="#meals-list-container"
                hx-swap="innerHTML"
                name="ingredient_ids"
                value="any"
                class="button-secondary"
                onclick="document.querySelectorAll('#filter-form select').forEach(s => s.value = '');">
            Reset Filters
        </button>
    </div>
</form>

<hr>

<!-- List of Meals -->
<h2>Available Meals</h2>
<div id="meals-list-container">
    {% include '_meals_list.html' %}
</div>

<div id="user-prompts"></div>
