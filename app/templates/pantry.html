<div class="pantry-header" style="margin-bottom: 2rem;">
    <h1 style="display: flex; align-items: center; gap: 0.75rem;"><i data-lucide="package" style="color: var(--primary);"></i> Pantry Management</h1>
    <p style="color: var(--text-muted);">Manage your current stock and add new ingredients.</p>
</div>

<div class="pantry-management-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; margin-bottom: 2.5rem;">
    <!-- Add Ingredient Section -->
    <section>
        <h2 style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="plus-circle" style="color: var(--secondary);"></i> Add New Ingredient</h2>
        <form id="add-ingredient-form" hx-post="/add_ingredient" hx-target="#ingredient-list-container" hx-swap="innerHTML" hx-on:htmx:after-request="if(event.detail.requestConfig.verb === 'post') this.reset()" class="card">
            <label for="q">Ingredient Name</label>
            <input type="text" name="q" id="q" placeholder="Enter ingredient name" required
                   hx-get="/search_pantry_ingredients" hx-trigger="keyup changed delay:300ms" hx-target="#search-results"
                   autocomplete="off">
            <div id="search-results"></div>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 0.5rem;">
                <div style="flex: 1;">
                    <label for="quantity">Quantity</label>
                    <input type="number" name="quantity" id="quantity" placeholder="Quantity" value="1" min="0" step="any">
                </div>
                <div style="flex: 1;">
                    <label for="unit">Unit</label>
                    <input type="text" name="unit" id="unit" placeholder="Unit (e.g., g, ml, cup)" list="unit-suggestions">
                </div>
            </div>
            
            <datalist id="unit-suggestions">
                <option value="g">
                <option value="kg">
                <option value="lb">
                <option value="oz">
                <option value="ml">
                <option value="l">
                <option value="cup">
                <option value="tbsp">
                <option value="tablespoon">
                <option value="tsp">
                <option value="teaspoon">
                <option value="unit">
            </datalist>
            <button type="submit" style="width: 100%;">
                <i data-lucide="plus"></i> Add to Pantry
            </button>
        </form>
    </section>

    <!-- Batch Add Ingredients Section -->
    <section>
        <h2 style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="layers" style="color: var(--primary);"></i> Batch Add</h2>
        <form id="batch-add-form" hx-post="/batch_add_ingredients" hx-target="#ingredient-list-container" hx-swap="innerHTML" hx-on:htmx:after-request="this.reset()" class="card">
            <label for="ingredients_list">List of Ingredients (comma-separated)</label>
            <textarea name="ingredients_list" id="ingredients_list" placeholder="e.g., carrots, onions, celery" rows="3" style="min-height: 100px;"></textarea>
            <button type="submit" style="width: 100%;" class="button-secondary">
                <i data-lucide="plus-square"></i> Batch Add
            </button>
            <p class="small-text" style="margin-top: 1rem; margin-bottom: 0;">This will add new ingredients with 0 quantity. You can edit details later.</p>
        </form>
    </section>
</div>

<!-- Area for server-side prompts like unit conversions -->
<div id="user-prompts"></div>

<hr>

<h2 style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="archive" style="color: var(--primary);"></i> My Stock</h2>
<div id="ingredient-list-container">
    {% with show_edit_buttons=True %}
        {% include '_ingredients_list.html' %}
    {% endwith %}
</div>
