<form hx-post="/edit_ingredient/{{ ingredient.id }}" hx-target="closest li" hx-swap="outerHTML" style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background: #f8fafc; border-radius: var(--radius-sm); border: 1px solid var(--border); margin: 0; box-shadow: none;">
    <input type="hidden" name="view_name" value="{{ view_name or 'pantry' }}">
    
    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem;">
        <div style="flex: 1;">
            <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">Ingredient Name</label>
            <input type="text" name="name" value="{{ ingredient.name }}" required style="margin-bottom: 0;">
        </div>
        <div style="flex: 1;">
            <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">Qty</label>
            <input type="text" name="quantity" value="{{ '%.2f'|format(ingredient.display_quantity) }}" required style="margin-bottom: 0;">
        </div>
        <div style="flex: 1;">
            <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">Unit</label>
            <select name="unit" style="margin-bottom: 0;">
                {% for unit in ingredient.compatible_units %}
                <option value="{{ unit }}" {% if unit == ingredient.display_unit %}selected{% endif %}>
                    {{ unit }}
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem;">
        <div style="flex: 1;">
            <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">Category</label>
            <select name="category" style="margin-bottom: 0;">
                {% for category in categories %}
                <option value="{{ category }}" {% if category == ingredient.category %}selected{% endif %}>
                    {{ category }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div style="flex: 1;">
            <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">Generic Parent (Optional)</label>
            <select name="parent_id" style="margin-bottom: 0;">
                <option value="">-- None --</option>
                {% for parent in potential_parents %}
                <option value="{{ parent.id }}" {% if parent.id == ingredient.parent_id %}selected{% endif %}>
                    {{ parent.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div style="display: flex; gap: 0.5rem;">
            <button type="submit" style="padding: 0.5rem 1rem;">
                <i data-lucide="check" style="width: 14px; height: 14px;"></i> Save
            </button>
            <button type="button" hx-get="/ingredient/{{ ingredient.id }}?view_name={{ view_name or 'pantry' }}" hx-target="closest li" hx-swap="outerHTML" class="button-secondary" style="padding: 0.5rem 1rem;">
                Cancel
            </button>
            <button type="button" hx-delete="/delete_ingredient/{{ ingredient.id }}" hx-confirm="Are you sure?" hx-target="closest li" hx-swap="outerHTML" class="button-danger" style="padding: 0.5rem;">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
            </button>
        </div>
    </div>
</form>
